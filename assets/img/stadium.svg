<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="甘肃胜利主场馆示意图">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset=".5" stop-color="#e4ecff"/>
      <stop offset="1" stop-color="#f2f4fb"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe8ff"/>
      <stop offset="1" stop-color="#c9d6ff"/>
    </linearGradient>
    <radialGradient id="pitch" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#43b581"/>
      <stop offset="1" stop-color="#2e9e6b"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <g fill="#ffffff" opacity=".6">
    <ellipse cx="1190" cy="140" rx="150" ry="34"/>
    <ellipse cx="1330" cy="120" rx="110" ry="26"/>
    <ellipse cx="250" cy="120" rx="120" ry="26"/>
    <ellipse cx="430" cy="80" rx="90" ry="20"/>
  </g>

  <g opacity=".16" fill="url(#beam)">
    <path d="M180 560 L100 0 L280 0 Z"/>
    <path d="M1420 560 L1320 0 L1500 0 Z"/>
  </g>

  <g fill="#1a1a2e" opacity=".92">
    <rect x="150" y="430" width="14" height="170" rx="6"/>
    <rect x="182" y="470" width="90" height="26" rx="10"/>
    <rect x="1436" y="430" width="14" height="170" rx="6"/>
    <rect x="1328" y="470" width="90" height="26" rx="10"/>
  </g>

  <ellipse cx="800" cy="560" rx="640" ry="230" fill="url(#bowl)"/>
  <path d="M150 470 Q800 330 1450 470 L1450 430 Q800 300 150 430 Z" fill="url(#roof)"/>
  <path d="M200 470 Q800 350 1400 470" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="6"/>

  <ellipse cx="800" cy="560" rx="640" ry="230" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="6"/>
  <ellipse cx="800" cy="578" rx="596" ry="202" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="4"/>
  <ellipse cx="800" cy="594" rx="556" ry="178" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="4"/>

  <ellipse cx="800" cy="610" rx="430" ry="140" fill="none" stroke="#8b5cf6" stroke-opacity=".35" stroke-width="10"/>

  <ellipse cx="800" cy="620" rx="360" ry="110" fill="url(#pitch)"/>
  <ellipse cx="800" cy="620" rx="360" ry="110" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="4"/>
  <line x1="800" y1="510" x2="800" y2="730" stroke="#ffffff" stroke-opacity=".6" stroke-width="4"/>
  <circle cx="800" cy="620" r="52" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="4"/>
  <rect x="470" y="588" width="120" height="64" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="4"/>
  <rect x="1010" y="588" width="120" height="64" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="4"/>
</svg>
